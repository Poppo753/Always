    title_width_pct: 0.92
    title_height_pct: 0.12
    body_top_pct: 0.18
    body_left_pct: 0.04
    body_width_pct: 0.54
    body_height_pct: 0.60
    image_top_pct: 0.16
    image_left_pct: 0.60
    image_width_pct: 0.36
    image_height_pct: 0.55
    stats_top_pct: 0.88
    stats_left_pct: 0.04
    stats_width_pct: 0.92
    stats_height_pct: 0.10

collage:
  max_images: 4
  hero_weight: 0.60
  thumb_weight: 0.40
