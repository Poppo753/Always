# Rendering configuration

slide:
  width_emu: 9144000   # 10 inches
  height_emu: 5143500  # 5.625 inches (16:9)

  colors:
    background: "1C1C2E"      # dark navy
    title: "FFFFFF"           # white
    body_text: "E0E0E0"       # light gray
    accent: "C9A84C"          # warm gold
    quote_text: "A8D8EA"      # soft blue
    stats_text: "888888"      # muted

  fonts:
    title_size: 32
    subtitle_size: 16
    body_size: 13
    quote_size: 14
    stats_size: 10

  layout:
    title_top_pct: 0.04
